version: "3.8"

services:
  # ==================== BACKEND API ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - FIREBASE_PROJECT_ID=flexboard-466304
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - flexboard-network

  # ==================== FRONTEND ADMIN ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
        - NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=flexboard-466304.firebaseapp.com
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=flexboard-466304
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=flexboard-466304.firebasestorage.app
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${FIREBASE_APP_ID}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - flexboard-network

  # ==================== ONPREM FRONTEND ====================
  onprem:
    build:
      context: ./onprem-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
        - NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=flexboard-466304.firebaseapp.com
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=flexboard-466304
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=flexboard-466304.firebasestorage.app
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${FIREBASE_APP_ID}
    ports:
      - "9002:3000"
    depends_on:
      - backend
    networks:
      - flexboard-network

networks:
  flexboard-network:
    driver: bridge
