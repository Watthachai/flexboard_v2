# ==================== FLEXBOARD BACKEND API - STAGING DEPLOYMENT ====================
# This file deploys ONLY the backend API (Express.js) to Cloud Run
# Includes Firebase Admin SDK and database connectors

steps:
  # ==================== DEPLOY FIRESTORE INDEXES (STAGING) ====================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-firestore-indexes-staging'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud firestore indexes create --database=flexb-staging-db --quiet < firestore.indexes.json || true
    waitFor: ['-']

  # ==================== BUILD BACKEND (STAGING) ====================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend-staging'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/flexboard-api-staging:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/flexboard-api-staging:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # ==================== PUSH IMAGE ====================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-staging-sha'
    args: ['push', 'gcr.io/$PROJECT_ID/flexboard-api-staging:$COMMIT_SHA']
    waitFor: ['build-backend-staging']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-staging-latest'
    args: ['push', 'gcr.io/$PROJECT_ID/flexboard-api-staging:latest']
    waitFor: ['build-backend-staging']

  # ==================== DEPLOY TO CLOUD RUN (STAGING) ====================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend-staging'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'flexboard-api-staging'
      - '--image'
      - 'gcr.io/$PROJECT_ID/flexboard-api-staging:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=development,FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIRESTORE_DATABASE_ID=flexb-staging-db'
      - '--set-secrets'
      - 'SECRET_KEY=FLEXBOARD_SECRET_KEY_STAGING:latest,FIREBASE_SERVICE_ACCOUNT=FLEXBOARD_FIREBASE_SERVICE_ACCOUNT_STAGING:latest,GEMINI_API_KEY=FLEXBOARD_GEMINI_API_KEY:latest'
      - '--max-instances'
      - '1'
      - '--min-instances'
      - '0'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--tag'
      - 'staging'
    waitFor: ['push-backend-staging-sha']

# ==================== IMAGES ====================
images:
  - 'gcr.io/$PROJECT_ID/flexboard-api-staging:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/flexboard-api-staging:latest'

# ==================== BUILD OPTIONS ====================
options:
  logging: CLOUD_LOGGING_ONLY

# ✅ Global timeout setting
timeout: '1800s'

# ==================== SUBSTITUTIONS ====================
substitutions:
  _FIREBASE_PROJECT_ID: 'SET_IN_CLOUD_BUILD_TRIGGER'
