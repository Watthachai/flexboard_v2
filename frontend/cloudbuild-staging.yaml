# ==================== FLEXBOARD ADMIN FRONTEND - STAGING DEPLOYMENT ====================
# This file deploys ONLY the admin frontend (Next.js) to Cloud Run
# Backend API URL must be set to point to flexboard-api-staging

steps:
  # ==================== BUILD FRONTEND (STAGING) ====================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend-staging'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_BACKEND_URL=${_BACKEND_URL_STAGING}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/flexboard-admin-staging:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/flexboard-admin-staging:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend'

  # ==================== PUSH IMAGE ====================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend-staging-sha'
    args: ['push', 'gcr.io/$PROJECT_ID/flexboard-admin-staging:$COMMIT_SHA']
    waitFor: ['build-frontend-staging']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend-staging-latest'
    args: ['push', 'gcr.io/$PROJECT_ID/flexboard-admin-staging:latest']
    waitFor: ['build-frontend-staging']

  # ==================== DEPLOY TO CLOUD RUN (STAGING) ====================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend-staging'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'flexboard-admin-staging'
      - '--image'
      - 'gcr.io/$PROJECT_ID/flexboard-admin-staging:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--max-instances'
      - '1'
      - '--min-instances'
      - '0'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--tag'
      - 'staging'
    waitFor: ['push-frontend-staging-sha']

# ==================== IMAGES ====================
images:
  - 'gcr.io/$PROJECT_ID/flexboard-admin-staging:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/flexboard-admin-staging:latest'

# ==================== BUILD OPTIONS ====================
options:
  logging: CLOUD_LOGGING_ONLY

# ✅ Global timeout setting
timeout: '2400s'

# ==================== SUBSTITUTIONS ====================
substitutions:
  _BACKEND_URL_STAGING: 'SET_IN_CLOUD_BUILD_TRIGGER'
  _FIREBASE_PROJECT_ID: 'SET_IN_CLOUD_BUILD_TRIGGER'
  _FIREBASE_API_KEY: 'SET_IN_CLOUD_BUILD_TRIGGER'
  _FIREBASE_AUTH_DOMAIN: 'SET_IN_CLOUD_BUILD_TRIGGER'
  _FIREBASE_STORAGE_BUCKET: 'SET_IN_CLOUD_BUILD_TRIGGER'
  _FIREBASE_MESSAGING_SENDER_ID: 'SET_IN_CLOUD_BUILD_TRIGGER'
  _FIREBASE_APP_ID: 'SET_IN_CLOUD_BUILD_TRIGGER'
